[package]
name = "min-repr-tracing-span"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "registry",
  "env-filter",
  "fmt",
  "json",
  "smallvec",
  "std",
  "tracing-log",
] }
tracing-opentelemetry = { version = "0.31.0", default-features = false, features = [
    "metrics",
    "tracing-log",
] }
opentelemetry = { version = "0.30.0", default-features = false, features = [
    "trace",
] }
opentelemetry-datadog = { version = "0.18.0", default-features = false, features = [
    "intern-ahash",
    "reqwest-client",
] }
opentelemetry_sdk = { version = "0.30.0", default-features = false, features = [
    "rt-tokio",
    "trace",
] }